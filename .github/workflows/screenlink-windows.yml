name: ScreenLink Windows

on:
  push:
    paths: ["ScreenLink/windows/**", ".github/workflows/screenlink-windows.yml"]
  pull_request:
    paths: ["ScreenLink/windows/**", ".github/workflows/screenlink-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: ScreenLink/windows/global.json
      - name: Protocol, pairing, TLS and key-mapping tests
        working-directory: ScreenLink/windows
        run: |
          dotnet restore tests/ScreenLink.Core.Tests --locked-mode
          dotnet test tests/ScreenLink.Core.Tests -c Release --no-restore

  app:
    name: Windows app (tests, security checks, publish, installer)
    needs: core
    runs-on: windows-2025
    env:
      BINSKIM_VERSION: "4.4.9.13"
      BINSKIM_SHA256: "5862f1e2a0c36439520d69c4ced69ed5bd704c705020d7f110baa9dd46f72a2c"
      # Authenticode signing runs only if the repository owner adds a certificate (see ScreenLink/SECURITY.md).
      HAS_SIGNING: ${{ secrets.SCREENLINK_SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: ScreenLink/windows/global.json
      - name: Core tests on Windows (Schannel TLS)
        working-directory: ScreenLink/windows
        run: |
          dotnet restore tests/ScreenLink.Core.Tests --locked-mode
          dotnet test tests/ScreenLink.Core.Tests -c Release --no-restore
      - name: "Security: no known-vulnerable NuGet packages"
        working-directory: ScreenLink/windows
        shell: pwsh
        run: |
          dotnet restore src/ScreenLink.App --locked-mode
          $out = dotnet list src/ScreenLink.App/ScreenLink.App.csproj package --vulnerable --include-transitive 2>&1
          $out | Write-Host
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found' }
      - name: Publish self-contained app
        working-directory: ScreenLink/windows
        run: dotnet publish src/ScreenLink.App -c Release --no-restore -o ../../out/ScreenLink
      - name: Check package contents and icon
        shell: pwsh
        run: |
          foreach ($f in "ScreenLink.exe", "ScreenLink.pri", "ScreenLink.ico", "Microsoft.WindowsAppRuntime.dll") {
            if (-not (Test-Path "out/ScreenLink/$f")) { throw "Missing $f in package" }
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path out/ScreenLink/ScreenLink.exe))
          if (-not $icon) { throw "ScreenLink.exe has no icon" }
      - name: "Security: BinSkim (Microsoft binary analyzer)"
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $pkg = "$env:RUNNER_TEMP/binskim.nupkg"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/$env:BINSKIM_VERSION/microsoft.codeanalysis.binskim.$env:BINSKIM_VERSION.nupkg" -OutFile $pkg
          if ((Get-FileHash $pkg -Algorithm SHA256).Hash -ne $env:BINSKIM_SHA256) { throw "BinSkim package checksum mismatch" }
          Expand-Archive $pkg "$env:RUNNER_TEMP/binskim" -Force
          $bs = "$env:RUNNER_TEMP/binskim/tools/net9.0/win-x64/BinSkim.exe"
          $targets = @("out/ScreenLink/ScreenLink.exe", "out/ScreenLink/ScreenLink.dll", "out/ScreenLink/ScreenLink.UI.dll", "out/ScreenLink/ScreenLink.Core.dll")
          & $bs analyze @targets --output binskim.sarif --log ForceOverwrite --level Error Warning --ignorePdbLoadError --config ScreenLink/windows/security/binskim-config.xml
          $sarif = Get-Content binskim.sarif -Raw | ConvertFrom-Json
          $results = @($sarif.runs | ForEach-Object { $_.results } | Where-Object { $_.level -eq 'error' -and -not $_.suppressions })
          foreach ($r in $results) { Write-Host "$($r.ruleId): $($r.message.text)" }
          if ($results.Count -gt 0) { throw "BinSkim found $($results.Count) error(s)" }
          Write-Host "BinSkim: no unsuppressed errors."
      - name: "Security: Microsoft Defender scan"
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles/Windows Defender/MpCmdRun.exe"
          if (Test-Path $mp) {
            & $mp -Scan -ScanType 3 -File "$PWD\out\ScreenLink" -DisableRemediation
            if ($LASTEXITCODE -eq 2) { throw "Defender flagged the package" }
            Write-Host "Defender scan exit code: $LASTEXITCODE"
          } else { Write-Host "Defender not available on this runner; scan skipped." }
      - name: Sign binaries (only when a signing certificate is configured)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.SCREENLINK_SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SCREENLINK_SIGN_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP/sign.pfx" /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out/ScreenLink/ScreenLink.exe
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path out/ScreenLink/* -DestinationPath ScreenLink-Windows-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content ScreenLink/windows/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.4.3 -y --no-progress; if ($LASTEXITCODE) { throw "Inno Setup install failed" } }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\out\ScreenLink" "/DOutputDir=$PWD" ScreenLink\windows\installer\ScreenLink.iss
          if ($LASTEXITCODE) { throw "Installer build failed" }
          $exe = "ScreenLink-Setup-$version-x64.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          "INSTALLER=$exe" >> $env:GITHUB_ENV
      - name: Sign installer (only when a signing certificate is configured)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.SCREENLINK_SIGN_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP/sign.pfx" /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:INSTALLER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScreenLink-Windows-x64
          path: |
            ScreenLink-Windows-x64.zip
            ${{ env.INSTALLER }}
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenlink-security-reports
          path: binskim.sarif
          if-no-files-found: ignore
          retention-days: 30

  ui-test:
    name: UI test (install, launch, network, uninstall)
    needs: app
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScreenLink-Windows-x64
          path: dist
      - name: Install, launch, check, uninstall
        shell: powershell
        run: |
          $installer = Get-ChildItem dist/ScreenLink-Setup-*-x64.exe | Select-Object -First 1
          & ScreenLink/windows/tests/ui/ui-smoke.ps1 -Installer $installer.FullName -OutDir "$PWD\ui-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenlink-ui-test-results
          path: ui-results
          retention-days: 30

  android:
    name: Android APK for the release
    if: startsWith(github.ref, 'refs/tags/screenlink-v')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ScreenLink/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Test and build the APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK after the release
        env:
          TAG: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "../../ScreenLink-${TAG#screenlink-v}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScreenLink-Android
          path: ScreenLink-*.apk
          retention-days: 30

  release:
    name: Publish GitHub Release (tags screenlink-v*)
    if: startsWith(github.ref, 'refs/tags/screenlink-v')
    needs: [app, ui-test, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScreenLink-Windows-x64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScreenLink-Android
          path: dist
      - name: Create release with the phone app, the installer and a portable zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "ScreenLink ${TAG#screenlink-v}" \
            --notes "Cast your Android phone's screen to your Windows laptop and type on the laptop from your phone.

          Phone (Android 10+): download ScreenLink-*.apk on the phone and open it (allow \"Install unknown apps\" when asked).
          Laptop (Windows 10 2004+ / 11, x64): run ScreenLink-Setup-*-x64.exe (per-user install, no admin rights). ScreenLink-Windows-x64.zip is a portable copy.

          Both devices must be on the same Wi-Fi. Not code-signed yet: Windows SmartScreen may warn (More info -> Run anyway). Instructions: ScreenLink/README.md."
