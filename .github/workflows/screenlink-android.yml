name: ScreenLink Android

on:
  push:
    paths: ["ScreenLink/android/**", ".github/workflows/screenlink-android.yml"]
  pull_request:
    paths: ["ScreenLink/android/**", ".github/workflows/screenlink-android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ScreenLink/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Test, lint and build release (R8)
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenlink-android-debug-apk
          path: ScreenLink/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenlink-android-lint
          path: ScreenLink/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
