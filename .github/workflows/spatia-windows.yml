name: Spatia Windows

on:
  push:
    paths: ["Spatia/windows/**", "Spatia/android/core-dsp/**", "Spatia/android/gradle/**", "Spatia/android/*.kts", "Spatia/android/gradle.properties", ".github/workflows/spatia-windows.yml"]
  pull_request:
    paths: ["Spatia/windows/**", "Spatia/android/core-dsp/**", "Spatia/android/gradle/**", "Spatia/android/*.kts", "Spatia/android/gradle.properties", ".github/workflows/spatia-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  engine:
    name: Shared engine (Kotlin/Native) + C API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Engine tests (JVM + native) and native libraries
        working-directory: Spatia/android
        run: ./gradlew :core-dsp:allTests :core-dsp:linkReleaseSharedMingwX64 :core-dsp:linkReleaseSharedLinuxX64
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: Spatia/windows/global.json
      - name: C# tests against the Linux build of the engine
        working-directory: Spatia/windows
        run: |
          dotnet restore tests/Spatia.Core.Tests --locked-mode
          dotnet test tests/Spatia.Core.Tests -c Release --no-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spatia-dsp-windows
          path: Spatia/android/core-dsp/build/bin/mingwX64/releaseShared/spatia_dsp.dll
          retention-days: 7

  app:
    name: Windows app (tests, security checks, publish, installer)
    needs: engine
    runs-on: windows-2025
    env:
      BINSKIM_VERSION: "4.4.9.13"
      BINSKIM_SHA256: "5862f1e2a0c36439520d69c4ced69ed5bd704c705020d7f110baa9dd46f72a2c"
      # Authenticode signing runs only if the repository owner adds a certificate (see Spatia/windows/SECURITY.md).
      HAS_SIGNING: ${{ secrets.SPATIA_SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spatia-dsp-windows
          path: Spatia/android/core-dsp/build/bin/mingwX64/releaseShared
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: Spatia/windows/global.json
      - name: C# tests against spatia_dsp.dll
        working-directory: Spatia/windows
        run: |
          dotnet restore tests/Spatia.Core.Tests --locked-mode
          dotnet test tests/Spatia.Core.Tests -c Release --no-restore
      - name: "Security: no known-vulnerable NuGet packages"
        working-directory: Spatia/windows
        shell: pwsh
        run: |
          dotnet restore src/Spatia.App --locked-mode
          $out = dotnet list src/Spatia.App/Spatia.App.csproj package --vulnerable --include-transitive 2>&1
          $out | Write-Host
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found' }
      - name: Publish self-contained app
        working-directory: Spatia/windows
        run: dotnet publish src/Spatia.App -c Release --no-restore -o ../../out/Spatia
      - name: Check package contents and icon
        shell: pwsh
        run: |
          # Spatia.pri holds the app's compiled XAML and the merged default control styles; without it the app
          # crashes as soon as it shows a control.
          foreach ($f in "Spatia.exe", "Spatia.pri", "spatia_dsp.dll", "Spatia.ico", "Microsoft.WindowsAppRuntime.dll") {
            if (-not (Test-Path "out/Spatia/$f")) { throw "Missing $f in package" }
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path out/Spatia/Spatia.exe))
          if (-not $icon) { throw "Spatia.exe has no icon" }
          Write-Host "Spatia.exe icon: $($icon.Width)x$($icon.Height)"
      - name: "Security: BinSkim (Microsoft binary analyzer)"
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $pkg = "$env:RUNNER_TEMP/binskim.nupkg"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/$env:BINSKIM_VERSION/microsoft.codeanalysis.binskim.$env:BINSKIM_VERSION.nupkg" -OutFile $pkg
          if ((Get-FileHash $pkg -Algorithm SHA256).Hash -ne $env:BINSKIM_SHA256) { throw "BinSkim package checksum mismatch" }
          Expand-Archive $pkg "$env:RUNNER_TEMP/binskim" -Force
          $bs = "$env:RUNNER_TEMP/binskim/tools/net9.0/win-x64/BinSkim.exe"
          # Our own binaries only (Microsoft's runtime DLLs are Microsoft-signed and analysed upstream).
          $targets = @("out/Spatia/Spatia.exe", "out/Spatia/spatia_dsp.dll", "out/Spatia/Spatia.dll", "out/Spatia/Spatia.UI.dll", "out/Spatia/Spatia.Core.dll", "out/Spatia/Spatia.Audio.dll")
          & $bs analyze @targets --output binskim.sarif --log ForceOverwrite --level Error Warning --ignorePdbLoadError --config Spatia/windows/security/binskim-config.xml
          $sarif = Get-Content binskim.sarif -Raw | ConvertFrom-Json
          $results = @($sarif.runs | ForEach-Object { $_.results } | Where-Object { $_.level -eq 'error' -and -not $_.suppressions })
          foreach ($r in $results) { Write-Host "$($r.ruleId): $($r.message.text)" }
          if ($results.Count -gt 0) { throw "BinSkim found $($results.Count) error(s)" }
          Write-Host "BinSkim: no unsuppressed errors."
      - name: "Security: Microsoft Defender scan"
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles/Windows Defender/MpCmdRun.exe"
          if (Test-Path $mp) {
            & $mp -Scan -ScanType 3 -File "$PWD\out\Spatia" -DisableRemediation
            if ($LASTEXITCODE -eq 2) { throw "Defender flagged the package" }
            Write-Host "Defender scan exit code: $LASTEXITCODE"
          } else { Write-Host "Defender not available on this runner; scan skipped." }
      - name: Sign binaries (only when a signing certificate is configured)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.SPATIA_SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.SPATIA_SIGN_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP/sign.pfx" /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out/Spatia/Spatia.exe out/Spatia/spatia_dsp.dll
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path out/Spatia/* -DestinationPath Spatia-Windows-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Spatia/windows/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.4.3 -y --no-progress; if ($LASTEXITCODE) { throw "Inno Setup install failed" } }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\out\Spatia" "/DOutputDir=$PWD" Spatia\windows\installer\Spatia.iss
          if ($LASTEXITCODE) { throw "Installer build failed" }
          $exe = "Spatia-Setup-$version-x64.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Write-Host "Built $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"
          "INSTALLER=$exe" >> $env:GITHUB_ENV
      - name: Sign installer (only when a signing certificate is configured)
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.SPATIA_SIGN_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP/sign.pfx" /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:INSTALLER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Spatia-Windows-x64
          path: |
            Spatia-Windows-x64.zip
            ${{ env.INSTALLER }}
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-reports
          path: binskim.sarif
          if-no-files-found: ignore
          retention-days: 30

  ui-test:
    name: UI test (install, launch, every page, uninstall)
    needs: app
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Spatia-Windows-x64
          path: dist
      - name: Install, launch, navigate, screenshot, uninstall
        shell: powershell
        run: |
          $installer = Get-ChildItem dist/Spatia-Setup-*-x64.exe | Select-Object -First 1
          & Spatia/windows/tests/ui/ui-smoke.ps1 -Installer $installer.FullName -OutDir "$PWD\ui-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-test-results
          path: ui-results
          retention-days: 30

  release:
    name: Publish GitHub Release (tags windows-v*)
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [app, ui-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Spatia-Windows-x64
          path: dist
      - name: Create release with installer and portable zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Spatia for Windows ${TAG#windows-v}" \
            --notes "Windows 10 (2004+) / 11, x64. Needs Equalizer APO (free, https://sourceforge.net/projects/equalizerapo/) to change the sound of all apps. Run Spatia-Setup-*.exe (per-user install, no admin rights), or extract the zip for a portable copy. Not code-signed yet: SmartScreen may warn (More info -> Run anyway). See Spatia/windows/README.md and Spatia/windows/CHANGELOG.md."
