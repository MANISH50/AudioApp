name: Windows

on:
  push:
    paths: ["windows/**", "android/core-dsp/**", "android/gradle/**", "android/*.kts", "android/gradle.properties", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "android/core-dsp/**", "android/gradle/**", "android/*.kts", "android/gradle.properties", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  engine:
    name: Shared engine (Kotlin/Native) + C API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Engine tests (JVM + native) and native libraries
        working-directory: android
        run: ./gradlew :core-dsp:allTests :core-dsp:linkReleaseSharedMingwX64 :core-dsp:linkReleaseSharedLinuxX64
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: windows/global.json
      - name: C# tests against the Linux build of the engine
        working-directory: windows
        run: |
          dotnet restore tests/Spatia.Core.Tests --locked-mode
          dotnet test tests/Spatia.Core.Tests -c Release --no-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spatia-dsp-windows
          path: android/core-dsp/build/bin/mingwX64/releaseShared/spatia_dsp.dll
          retention-days: 7

  app:
    name: Windows app (tests, publish, package)
    needs: engine
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spatia-dsp-windows
          path: android/core-dsp/build/bin/mingwX64/releaseShared
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: windows/global.json
      - name: C# tests against spatia_dsp.dll
        working-directory: windows
        run: |
          dotnet restore tests/Spatia.Core.Tests --locked-mode
          dotnet test tests/Spatia.Core.Tests -c Release --no-restore
      - name: Publish self-contained app
        working-directory: windows
        run: |
          dotnet restore src/Spatia.App --locked-mode
          dotnet publish src/Spatia.App -c Release --no-restore -o ../out/Spatia
      - name: Check package contents
        shell: pwsh
        run: |
          foreach ($f in "Spatia.exe", "spatia_dsp.dll", "Microsoft.WindowsAppRuntime.dll") {
            if (-not (Test-Path "out/Spatia/$f")) { throw "Missing $f in package" }
          }
      - name: Startup smoke test (app must stay running for 15 s)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "out/Spatia/Spatia.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Spatia exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Host "Spatia started and kept running."
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path out/Spatia/* -DestinationPath Spatia-Windows-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = ([xml](Get-Content windows/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.4.3 -y --no-progress; if ($LASTEXITCODE) { throw "Inno Setup install failed" } }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\out\Spatia" "/DOutputDir=$PWD" windows\installer\Spatia.iss
          if ($LASTEXITCODE) { throw "Installer build failed" }
          $exe = "Spatia-Setup-$version-x64.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Write-Host "Built $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"
          "INSTALLER=$exe" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Spatia-Windows-x64
          path: |
            Spatia-Windows-x64.zip
            ${{ env.INSTALLER }}
          retention-days: 30

  release:
    name: Publish GitHub Release (tags windows-v*)
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Spatia-Windows-x64
          path: dist
      - name: Create release with installer and portable zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Spatia for Windows ${TAG#windows-v}" \
            --notes "Windows 10 (2004+) / 11, x64. Run Spatia-Setup-*.exe (per-user install, no admin rights), or extract the zip for a portable copy. Not code-signed yet: SmartScreen may warn (More info -> Run anyway). See windows/README.md and windows/CHANGELOG.md."
